<!DOCTYPE html>
<html lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApartRent - צור קשר</title>

  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Assistant:wght@400;700&display=swap" rel="stylesheet">
  <script defer src="js/script.js"></script>
</head>

<body>
  <header class="site-header">
    <h1 class="site-logo">
      <img src="images/index_logo.png" alt="ApartRent Logo">
      ApartRent
    </h1>

    <button id="floating-theme-btn" class="floating-theme-btn">🌙</button>

    <nav class="navbar">
        <div class="logo">
            <a href="#"></a>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">בית</a></li>
            <li><a href="apartments.html">דירות</a></li>
            <li><a href="help.html">כאן כדי לעזור</a></li>
            <li><a href="about.html">אודות</a></li>
            <li><a href="contact.html"class="active">צור קשר</a></li>

        </ul>
        <div class="menu-toggle">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </nav>

    <script>
        let toggleMode = false;
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.querySelector('.menu-toggle');
            const navLinks = document.querySelector('.nav-links');

            menuToggle.addEventListener('click', () => {
                if (!toggleMode) {
                    menuToggle.classList.add('active');
                } else {
                    menuToggle.classList.remove('active');
                }
                navLinks.classList.toggle('active');
                toggleMode = !toggleMode;
            });



        });



    </script>

      <ul>

  </header>

  <main class="contact">
    <h2>נשמח לשמוע ממך</h2>

    <form id="contactForm" class="card-form">

      <label for="name">שם מלא</label>
      <input type="text" id="name" placeholder="הקלידי שם מלא" required>
      <div class="error"></div>

      <label for="email">אימייל</label>
      <input type="email" id="email" placeholder="name@example.com" required>
      <div class="error"></div>

      <label for="message">הודעה</label>
      <textarea id="message" rows="5" placeholder="במה נוכל לעזור?" required></textarea>
      <div class="error"></div>

      <button type="submit" class="btn btn-primary">שליחה</button>
    </form>
  </main>

  <!-- 🔗 כפתור וואטסאפ -->
  <div class="whatsapp-contact">
    <a href="https://wa.me/0587785459" target="_blank" class="whatsapp-btn">
      <img src="images/whatsapp.jpg" alt="WhatsApp" class="whatsapp-logo">
      דברו איתנו ב־WhatsApp
    </a>
  </div>

  <footer>
    <p>© 2025 ApartRent | כל הזכויות שמורות</p>
  </footer>
  <script>
    // כפתור מצב לילה צף
const themeBtn = document.getElementById("floating-theme-btn");
const body = document.body;

// טעינה — אם נבחר Dark בעבר, טען אותו
if (localStorage.getItem("theme") === "dark") {
  body.classList.add("dark-mode");
  themeBtn.textContent = "☀️";
}

// לחיצה — החלפת מצב
themeBtn.addEventListener("click", () => {
  const isDark = body.classList.toggle("dark-mode");
  themeBtn.textContent = isDark ? "☀️" : "🌙";
  localStorage.setItem("theme", isDark ? "dark" : "light");
});
  </script>
  <!-- 🔔 POPUP יתווסף ב-JS (לא צריך כאן HTML נוסף) -->

</body>
</html>
